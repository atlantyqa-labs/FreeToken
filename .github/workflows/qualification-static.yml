name: Qualification Wave 0 Static
on:
  pull_request:
    paths: ["qualification/**","Dockerfile.qualification",".github/workflows/qualification-*.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          bash -n qualification/run.sh
          python -m py_compile qualification/*.py
          python -m pip install jsonschema
          python -m json.tool qualification/upstream.lock.json >/dev/null
          test "$(jq -r .commit qualification/upstream.lock.json)" = "2757bb5f91156fc8a44d88ec4b302a81f10c9e81"
          test -f LICENSE
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: qualification-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-static-evidence
          path: |
            qualification-sbom.cdx.json
            qualification/upstream.lock.json
            qualification/evidence.schema.json
